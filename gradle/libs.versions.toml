[bundles]
androidx-room = ["androidx-room-runtime", "androidx-room-ktx"]
ktor = [
    "ktor-client-core",
    "ktor-client-okhttp",
    "ktor-client-auth",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
